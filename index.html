<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Chill</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- (Optional) avoid favicon 404 -->
  <!-- <link rel="icon" href="favicon.ico" /> -->
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 1) PIXI UMD bundle (drops window.PIXI) -->
  <script src="https://pixijs.download/v7.2.4/pixi.min.js"></script>

  <!-- 2) PIXI filters (they hook into window.PIXI) -->
  <script src="https://pixijs.download/filters/glow/pixi-filters-glow.min.js"></script>
  <script src="https://pixijs.download/filters/blur/pixi-filters-blur.min.js"></script>

  <!-- 3) GSAP (order here doesn’t matter) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <!-- 4) Your module entry-point -->
  <script type="module" src="main.js"></script>
</body>

</html>
